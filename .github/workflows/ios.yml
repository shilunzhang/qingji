name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (需要 iOS 26 SDK 提供 FoundationModels)
        run: |
          ls -d /Applications/Xcode*.app | sort -V | tail -1
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & Test (iOS Simulator)
        run: |
          set -o pipefail
          # 动态取一个可用 iPhone 模拟器的 UDID，避免 runner 镜像更新导致设备名失效
          DEVICE_ID=$(xcrun simctl list devices available | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          echo "Using simulator: $DEVICE_ID"
          xcodebuild test \
            -project QingJi.xcodeproj \
            -scheme QingJi \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

  # 产出未签名 ipa 工件：供 Windows 端爱思助手/Sideloadly 用免费 Apple ID 重签安装（文档 T13）
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app (Release, 真机 arm64)
        run: |
          xcodebuild build \
            -project QingJi.xcodeproj \
            -scheme QingJi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS= \
            -derivedDataPath build

      - name: Package unsigned ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/Build/Products/Release-iphoneos/QingJi.app" build/Payload/
          cd build
          zip -qry QingJi-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingJi-unsigned-ipa
          path: build/QingJi-unsigned.ipa
          retention-days: 14
